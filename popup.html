<!DOCTYPE html>
<html>
<head>
  <title>Flipkart Price Scraper</title>
  <script src="xlsx.full.min.js"></script>
  <style>
    body { width: 280px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    h3 { color: #2874f0; margin-top: 0; }
    input { margin-bottom: 10px; font-size: 12px; width: 100%; }
    button { 
      width: 100%; 
      padding: 10px; 
      background-color: #fb641b; 
      color: white; 
      border: none; 
      border-radius: 2px;
      cursor: pointer; 
      font-weight: bold;
    }
    button:hover { background-color: #f4511e; }
    #status { margin-top: 15px; font-size: 13px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <h3>Price Scraper</h3>
  <p style="font-size: 11px;">Upload Excel with <b>FSN</b> column.</p>
  <input type="file" id="fileInput" accept=".xlsx" />
  <button id="startBtn">GET PRICES</button>
  <div id="status">Ready</div>
  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
